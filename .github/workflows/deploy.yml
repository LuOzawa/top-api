name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # Workload Identity Federation 需要

env:
  PROJECT_ID: project-ec1a0092-7fc0-4dbc-8fd
  REGION: us-central1
  AR_REPO: apps
  SERVICE: top-api

jobs:
  # ① 测试：用临时 Postgres 容器跑真实 CRUD 测试
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        env:
          PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          API_KEY: test-key
          OWNER: me
        run: pytest -q

  # ② 部署：测试通过才执行
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google Cloud (keyless / WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/326624733889/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: gh-deployer@project-ec1a0092-7fc0-4dbc-8fd.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          gcloud run deploy "${{ env.SERVICE }}" \
            --image="$IMAGE" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --add-cloudsql-instances="${{ env.PROJECT_ID }}:${{ env.REGION }}:digest-pg" \
            --set-env-vars="DATA_BUCKET=luozawa-top-data,INSTANCE_CONNECTION_NAME=${{ env.PROJECT_ID }}:${{ env.REGION }}:digest-pg,DB_USER=app,DB_NAME=digest,OWNER=me" \
            --set-secrets="DB_PASSWORD=db-password:latest,API_KEY=api-key:latest" \
            --quiet

      - name: Show service URL
        run: gcloud run services describe "${{ env.SERVICE }}" --region="${{ env.REGION }}" --format="value(status.url)"
